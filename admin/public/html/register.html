<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta content='IE=edge' http-equiv=X-UA-Compatible>
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
    <meta name="description" content="">
    <meta name="author" content="">

    <title>Register Panel</title>
    <!-- Font awsome link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- Custom Css -->
    <link rel="stylesheet"  href="../css/login.css">
    <script  type="text/javascript" src="../../server.js"></script>
</head>

<body>
    <!-- ########## START: Login Form ########## -->
    <section class="login-wrapper">
        <a href="index.html" class="logo"><img src="./ad-images/logo.png" alt=" Admin Panel" width="150" style="border-radius: 50%;margin-top: 6rem;"/></a>
        <div class="login-form">
            <div class="row">
                <div class="row1">
                    <div class="pagetitle">
                        <h2>Create Account</h2>
                        <span>Fill the below form to create a new account.</span>
                    </div>
                    <form action="/register" method="POST">
                        <div class="form-group">
                            <label>Username</label>
                            <input type="text" class="form-control" placeholder="Username" name="username" required>
                        </div>
                        <div class="form-group mb-4">
                            <label>Email Id</label>
                            <input type="text" class="form-control" placeholder="john.doe@domain.com" name="email" required>
                        </div>
                        <div class="form-group mb-4">
                            <label>Password</label>
                            <input type="password" class="form-control" placeholder="Password" aria-label="Password"  name="password" required>
                        </div>
                        <div class="form-group mb-4">
                            <label>Confirm Password</label>
                            <input type="text" class="form-control" placeholder="Confirm Password" aria-label="Password" name="cpassword" required>
                        </div>
                        <div class="form-group checkbox">
                            <input type="checkbox" name="checkbox" id="check1">
                            <label for="check1">I accept the terms & conditions.</label>
                        </div>
                        <div class="forgot">
                            <a href="login.html" class="btn btn-login">Login</a>
                            <button type="submit" class="btn btn-register">Register</button>
                        </div>
                    </form>
                </div>
                <div class="row2">
                    <img src="./ad-images/login-mockup.svg" alt="">
                </div>
            </div>
        </div>
    </section>
    <!-- ########## END: Login Form ########## -->
     
</body>

</html>
