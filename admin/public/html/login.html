<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta content='IE=edge' http-equiv=X-UA-Compatible>
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
    <meta name="description" content="">
    <meta name="author" content="">

    <title>Login Panel</title>
    <!-- Font awsome link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- Custom Css -->
    <link rel="stylesheet" type="text/css" href="../css/login.css">

</head>

<body>
    <!-- ########## START: Login Form ########## -->
    <section class="login-wrapper">
        <a href="index.html"class="logo"><img src="./ad-images/logo/logo.png" alt=" Admin Panel" width="150" style="border-radius: 50%;"/></a>
        <div class="login-form">
            <div class="row">
                <div class="row1">
                    <div class="pagetitle">
                    </div>
                    <form action="/login" method="post">
                        <div class="form-group">
                            <label>Email Id</label>
                            <input type="text" class="form-control"
                                placeholder="john.doe@domain.com" required>
                        </div>
                        <div class="form-group">
                            <label>Password</label>
                            <div class="input-group">
                                <input  id="password-field" type="password" class="form-control password__box"
                                    placeholder="Password" aria-label="Password" required>
                                
                            </div>
                        </div>
                        <div class="form-group checkbox">
                            <input type="checkbox" name="checkbox" id="check1">
                            <label for="check1">Remember me</label>
                        </div>
                        <div class="forgot">
                            <a href="forgot.html" class="btn-link">Forgot password?</a>
                            <button type="submit"
                                class="btn btn-primary waves-effect">Login</button>
                        </div>
                        <hr>
                        <a href="register.html"
                            class="btn btn-outline-primary waves-effect" style="font-size: 1.2rem;">Create an
                            account</a>
                    </form>
                </div>
                <div class="row2">
                    <img src="./ad-images/login-mockup.svg" alt="">
                </div>
            </div>
        </div>
    </section>
    <!-- ########## END: Login Form ########## -->
</body>

</html>
