<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta content='IE=edge' http-equiv=X-UA-Compatible>
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
    <meta name="description" content="">
    <meta name="author" content="">

    <title>forgot password</title>
    <!-- Font awsome link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- Custom Css -->
    <link rel="stylesheet" type="text/css" href="../css/login.css">

</head>

<body>
    <!-- ########## START: Login Form ########## -->
    <section class="login-wrapper">
        <a href="index.html" class="logo"><img src="./ad-images/logo/logo.png" alt="MS Admin Panel" width="150" style="border-radius: 50%;"/></a>
        <div class="login-form">
            <div class="row">
                <div class="row1">
                    <div class="pagetitle mb-4">
                        <h2>Recover your password</h2>
                        <span>Please enter your email address and we'll send you <br/>instructions on how to reset your password.</span>
                    </div>
                    <form>
                        <div class="form-group">
                            <label>Email Id</label>
                            <input type="text" class="form-control"
                                placeholder="john.doe@domain.com" required>
                        </div>
                        <div class="forgot">
                            <a href="login.html" class="btn btn-outline-primary waves-effect" style="padding: 21px 30px;width: 40%;">Back To Login</a>
                            <button type="submit"
                                class="btn btn-primary waves-effect waves-primary">Recovery Password</button>
                        </div>
                    </form>
                </div>
                <div class="row2">
                    <img src="./ad-images/login-mockup.svg" width="300" alt="">
                </div>
            </div>
        </div>
    </section>
    <!-- ########## END: Login Form ########## -->
</body>

</html>
