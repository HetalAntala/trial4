<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Panel</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Sharp" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside>
            <div class="top">
                <div class="logo">
                    <img src="../ad-images/logo.png" alt="Logo" />
                    <h2>Nature's <span class="danger">Palette</span></h2>
                </div>
            </div>
            <div class="sidebar">
                <div class="account__tabs">
                    <p class="account__tab active-tab" data-target="#dashboard" onclick="showSection('dashboard')">
                        <img src="../ad-images/icon/dashboard.png" alt="">Dashboard
                    </p>
                    <p class="account__tab" data-target="#orders" onclick="showSection('orders')">
                        <img src="../ad-images/icon/order.png" alt=""> Orders
                    </p>
                    <p class="account__tab" data-target="#logout" onclick="showSection('logout')" id="logoutBtn">
                        <img src="../ad-images/icon/order.png" alt=""> Logout
                    </p>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="tab__content active-tab" content id="dashboard">
                <h2>Welcome, <span id="deliveryPersonName">Delivery Person</span></h2>
                <p>Manage your assigned deliveries efficiently.</p>
                <div class="dashboard-cards">
                    <div class="card">Total Deliveries: <span id="total-deliveries">0</span></div>
                    <div class="card">Pending Deliveries: <span id="pending-deliveries">0</span></div>
                    <div class="card">Completed Deliveries: <span id="completed-deliveries">0</span></div>
                </div>
            </div>

            <section content id="orders" class="tab__content">
                <h2>Delivery Orders</h2>
                <input type="text" id="searchOrders" placeholder="Search Orders..." onkeyup="searchOrders()">
                <table>
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Customer Name</th>
                            <th>Status</th>
                            <th>Payment Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="delivery-list"></tbody>
                </table>
            </section>

            <!-- Hidden section for logout -->
            <section content id="logout" class="tab__content">
                <h2>Logging out...</h2>
            </section>
        </main>
    </div>

    <script>
        // Show the selected section and hide others
        function showSection(sectionId) {
            const sections = document.querySelectorAll('.tab__content');
            sections.forEach(section => {
                section.classList.remove('active-tab');
            });

            const targetSection = document.querySelector(`#${sectionId}`);
            if (targetSection) {
                targetSection.classList.add('active-tab');
            }

            const tabs = document.querySelectorAll('.account__tab');
            tabs.forEach(tab => {
                tab.classList.remove('active-tab');
                if (tab.dataset.target === `#${sectionId}`) {
                    tab.classList.add('active-tab');
                }
            });
        }

        document.addEventListener("DOMContentLoaded", function() {
            const deliveryPersonId = localStorage.getItem("deliveryPersonId");
            if (!deliveryPersonId) {
                window.location.href = "html/login.html"; // Redirect if not logged in
            }
        });

        document.addEventListener("DOMContentLoaded", fetchDeliveries);

        async function fetchDeliveries() {
            try {
                const deliveryPersonId = localStorage.getItem("deliveryPersonId") || 1; // Dummy ID for testing
                const response = await fetch(`/delivery/deliveries/${deliveryPersonId}`);
                const deliveries = await response.json();

                if (!Array.isArray(deliveries)) throw new Error("Invalid response format");

                // Filter out orders that are both "Delivered" and "Paid"
                const filteredDeliveries = deliveries.filter(delivery => {
                    return !(delivery.status === "Delivered" && delivery.payment_status === "Paid");
                });

                let total = filteredDeliveries.length;
                let pending = filteredDeliveries.filter(d => d.status !== "Delivered").length;
                let completed = filteredDeliveries.filter(d => d.status === "Delivered").length;

                console.log("Total Orders:", total, "Pending:", pending, "Completed:", completed);

                document.getElementById("total-deliveries").textContent = total;
                document.getElementById("pending-deliveries").textContent = pending;
                document.getElementById("completed-deliveries").textContent = completed;

                const tableBody = document.getElementById("delivery-list");
                tableBody.innerHTML = "";
                filteredDeliveries.forEach(delivery => {
                    const row = `<tr>
                        <td>${delivery.id}</td>
                        <td>${delivery.customer_name}</td>
                        <td>${delivery.status}</td>
                        <td>${delivery.payment_status || "Pending"}</td>
                        <td>
                            <button class="update-btn" onclick="updateStatus(${delivery.id}, 'Delivered')">Mark as Delivered</button>
                            <button class="update-btn" onclick="updatePayment(${delivery.id}, 'Paid')">Mark as Paid</button>
                        </td>
                    </tr>`;
                    tableBody.innerHTML += row;
                });
            } catch (error) {
                console.error("Error fetching deliveries:", error);
            }
        }

        async function updateStatus(deliveryId, status) {
            try {
                const response = await fetch("/delivery/update-status", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ deliveryId, status })
                });
                if (!response.ok) throw new Error("Failed to update status");
                fetchDeliveries(); // Refresh the table to filter out completed orders
            } catch (error) {
                console.error("Error updating status:", error);
            }
        }

        async function updatePayment(deliveryId, paymentStatus) {
            try {
                const response = await fetch("/delivery/update-payment", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ deliveryId, paymentStatus })
                });
                if (!response.ok) throw new Error("Failed to update payment status");
                fetchDeliveries(); // Refresh the table to filter out completed orders
            } catch (error) {
                console.error("Error updating payment status:", error);
            }
        }

        function searchOrders() {
            let input = document.getElementById("searchOrders").value.toLowerCase();
            let rows = document.querySelectorAll("#delivery-list tr");
            rows.forEach(row => {
                row.style.display = row.innerText.toLowerCase().includes(input) ? "" : "none";
            });
        }

        // Logout Functionality
        document.getElementById("logoutBtn").addEventListener("click", async function() {
            await fetch("/logout", { method: "POST" });
            window.location.href = "login.html";
        });
    </script>
</body>
</html>
