<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Whishlist</title>
    <!-- custom css link -->
    <link rel="stylesheet" href="../css/style.css" />
    <style>
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }

      table,
      th,
      td {
        border: 1px solid #ddd;
      }

      th,
      td {
        padding: 15px;
        text-align: center;
      }

      th {
        background-color: #4caf50;
        color: white;
      }

      tr:nth-child(even) {
        background-color: #f2f2f2;
      }

      /* Product Image */
      td img {
        width: 50px;
        height: auto;
        border-radius: 5px;
      }

      /* Buttons */
      button {
        padding: 8px 12px;
        border: none;
        cursor: pointer;
        border-radius: 5px;
        font-size: 14px;
        transition: background 0.3s;
      }

      button.remove {
        background-color: #ff4d4d;
        color: white;
      }

      button.remove:hover {
        background-color: #cc0000;
      }

      button.add-cart {
        background-color: #28a745;
        color: white;
      }

      button.add-cart:hover {
        background-color: #1e7e34;
      }

      /* Cart Page Styles */
      .wishlist-items {
        padding: 1rem;
      }

      .wishlist-item {
        display: flex;
        align-items: center;
        border-bottom: 1px solid #ddd;
        padding: 1rem 0;
      }

      .wishlist-item img {
        width: 100px;
        height: auto;
        margin-right: 1rem;
      }

      .wishlist-item-actions button {
        background: #ff4d4d;
        color: white;
        border: none;
        padding: 0.5rem 1rem;
        cursor: pointer;
      }

      .wishlist-item-actions button:hover {
        background: #ff1a1a;
      }
    </style>
  </head>

  <body>
    <!-- Header section starts -->
    <div id="nav"></div>
    <!-- Header section ends -->
    <!-- Whishlsit section starts -->
    <section id="wishlist-items" class="wishlist-items conatiner">
      <h1>Your Whishlist:</h1>
      <table>
        <thead>
          <tr>
            <th>Item</th>
            <th>Name</th>
            <th>Price</th>
            <th>Stock</th>
            <th>Action</th>
            <th>Add</th>
          </tr>
        </thead>
        <tbody id="wishlist-container"></tbody>
        <!-- ✅ Now inside <table> -->
      </table>
      <!-- Cart items will be dynamically loaded here -->
    </section>
    <!-- whishlist section ends -->
    <br /><br />
    <!-- Footer section  starts-->
    <div id="footer"></div>
    <!-- Footer section  ends-->
    <button id="btnScrollToTop">
      <i class="fa-solid fa-arrow-up"></i>
    </button>

    <script>
      const btnScrollToTop = document.querySelector("#btnScrollToTop");
      btnScrollToTop.addEventListener("click", function () {
        window.scrollTo(0, 0);
      });
      async function loadNav() {
        try {
          const response = await fetch("/header");
          if (!response.ok) {
            throw new Error(`HTTP error! Status: ${response.status}`);
          }
          const data = await response.text();
          document.getElementById("nav").innerHTML = data;
          console.log("Navigation loaded successfully");
        } catch (error) {
          console.error("Error loading navigation:", error);
          // Optionally, you can show an error message to the user
          document.getElementById("nav").innerHTML =
            "<p>Failed to load navigation.</p>";
        }
      }
      async function loadFooter() {
        try {
          const response = await fetch("/footer");
          if (!response.ok) {
            throw new Error(`HTTP error! Status: ${response.status}`);
          }
          const data = await response.text();
          document.getElementById("footer").innerHTML = data;
          console.log("Footer loaded successfully");
        } catch (error) {
          console.error("Error loading footer:", error);
          // Optionally, you can show an error message to the user
          document.getElementById("footer").innerHTML =
            "<p>Failed to load footer.</p>";
        }
      }
      document.addEventListener("DOMContentLoaded", loadNav);
      document.addEventListener("DOMContentLoaded", loadFooter);

      document.addEventListener("DOMContentLoaded", function () {
        const wishlistContainer = document.getElementById("wishlist-container");

        if (!wishlistContainer) {
          console.error("Wishlist container not found!");
          return;
        }

        const wishlist = [
          {
            id: 1,
            name: "Monstera Deliciosa",
            price: "Rs. 250",
            stock: "In Stock",
            image: "../../Database(image)/Plant/P0001/1.jpg",
          },
          {
            id: 2,
            name: "Fiddle Leaf Fig",
            price: "Rs. 350",
            stock: "Low Stock",
            image: "../../Database(image)/Plant/P0002/1.jpg",
          },
          {
            id: 3,
            name: "Snake Plant",
            price: "Rs. 200",
            stock: "In Stock",
            image: "../../Database(image)/Plant/P0003/1.jpg",
          },
        ];

        function loadWishlist() {
          wishlistContainer.innerHTML = "";
          wishlist.forEach((product) => {
            wishlistContainer.innerHTML += `
                <tr>
                    <td><img src="${product.image}" alt="${product.name}" width="50"></td>
                    <td>${product.name}</td>
                    <td>${product.price}</td>
                    <td>${product.stock}</td>
                    <td><button onclick="removeFromWishlist(${product.id})">Remove</button></td>
                    <td><button class="add-btn" onclick="addToCart(${product.id})">Add to Cart</button></td>
                </tr>
            `;
          });
        }

        function removeFromWishlist(id) {
          const index = wishlist.findIndex((item) => item.id === id);
          if (index !== -1) {
            wishlist.splice(index, 1);
            loadWishlist();
          }
        }

        loadWishlist();
      });
      function addToCart(id) {
        const product = products.find((p) => p.id === id);
        if (product.stock <= 0) {
          alert("Sorry, this product is out of stock!");
          return;
        }

        // Check if product is already in cart
        const productIndex = cart.findIndex((item) => item.id === id);
        if (productIndex !== -1) {
          cart[productIndex].quantity++;
        } else {
          cart.push({ ...product, quantity: 1 });
        }

        alert(`${product.name} has been added to your cart!`);
      }
    </script>
    <!-- Custom JS -->
    <script
      type="module"
      src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"
    ></script>
    <script src="../js/main.js"></script>
  </body>
</html>
