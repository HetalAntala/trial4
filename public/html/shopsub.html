    function displayProducts(containerId) {
      const container = document.getElementById(containerId);
      container.innerHTML = ""; // Clear previous products

      products.forEach(product => {
        const productCard = document.createElement("div");
        productCard.className = "product-card";
        productCard.innerHTML = `
        <a href='../html/productdetail.html'><img src="${product.image}" alt="${product.name}"></a>
        <a href='../html/productdetail.html'><h3>${product.name}</h3></a>
          <p>Rating: ${product.rating} ⭐</p>
          <p>Price: $${product.price}</p>

             <a href="#" class="action__btn" aria-label="Add to Wishlist">

                  </a>
                  <a href="#" class="action__btn" aria-label="ADD TO CART">
                    <i class="fa-solid fa-cart-shopping"></i>
                  </a>
          </div>
        `;
        container.appendChild(productCard);
      });
    }
    function displayProducts1(containerId) {

    const options = [
        { value: "1", text: "Sort By Size" },
        { value: "2", text: "Sort By Price" },
        { value: "3", text: "Sort By Popularity" },
        { value: "4", text: "Sort By Sale" },
        { value: "5", text: "Sort By Rating" }
    ];

    const dropdowns = {
        sizeFilter: ["Size", ...options],
        colorFilter: ["Color", ...options],
        defaultSorting: ["Default Sorting", ...options]
    };

    // Function to populate select elements
    function populateDropdown(id, options) {
        const select = document.getElementById(id);
        options.forEach(option => {
            const opt = document.createElement("option");
            opt.value = option.value;
            opt.textContent = option.text;
            select.appendChild(opt);
        });
    }

    // Populate all dropdowns
    Object.keys(dropdowns).forEach(id => {
        populateDropdown(id, dropdowns[id].map((text, index) => ({
            value: index.toString(),
            text
        })));
    });
